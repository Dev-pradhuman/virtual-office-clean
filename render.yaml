# Render Blueprint for the Virtual Office cloud backend and Team Hearth frontend.
# Render supplies PORT automatically; do not define it as a runtime variable.
# Set ALLOWED_ORIGINS to:
# http://localhost:3000,https://virtual-office-clean.onrender.com
services:
  - type: web
    name: virtual-office-clean
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm run build:render
    startCommand: npm run start:server
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
