<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Chat</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Standalone, always-on-top mini chat window (Google Meet pop-out style). */
    html, body { height: 100%; }
    body { background: transparent; overflow: hidden; display: block; }
    #mini {
      display: flex; flex-direction: column; height: 100vh;
      background: var(--panel-glass); border: 1px solid var(--glass-border);
      border-radius: 14px; overflow: hidden;
    }
    #mini-head {
      -webkit-app-region: drag; user-select: none;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; font-size: 13px; font-weight: 600;
      border-bottom: 1px solid var(--glass-border);
    }
    #mini-head .mh-title { display: flex; align-items: center; gap: 8px; }
    #mini-head .mh-title .dot { width: 8px; height: 8px; }
    .mh-actions { -webkit-app-region: no-drag; display: flex; gap: 2px; }
    .mh-btn {
      background: transparent; border: none; color: var(--text-muted);
      font-size: 13px; line-height: 1; cursor: pointer; padding: 5px 7px;
      border-radius: 6px; transition: all 0.15s;
    }
    .mh-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }
    #mini-messages {
      flex: 1; overflow-y: auto; padding: 10px 12px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .m-msg { font-size: 13px; line-height: 1.4; color: var(--text-main); word-break: break-word; }
    .m-msg strong { color: var(--primary-color); font-weight: 600; }
    .m-msg.self strong { color: var(--text-muted); }
    .m-note { color: var(--text-muted); font-size: 13px; padding: 12px; text-align: center; }
    #mini-form { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--glass-border); }
    #mini-form input { flex: 1; padding: 7px 10px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="mini">
    <div id="mini-head">
      <span class="mh-title"><span class="dot" id="mini-dot"></span> Team Chat</span>
      <span class="mh-actions">
        <button class="mh-btn" id="mini-open-app" title="Open the full app">⤢</button>
        <button class="mh-btn" id="mini-close" title="Close">✕</button>
      </span>
    </div>
    <div id="mini-messages"></div>
    <form id="mini-form">
      <input type="text" id="mini-input" placeholder="Message the team…" autocomplete="off">
      <button type="submit" class="icon-btn primary">➤</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/mini.js"></script>
</body>
</html>
