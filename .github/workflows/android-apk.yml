name: Build Android APK

# Builds the Team Hearth web app into a debug-signed Android APK using Capacitor.
# The web assets are bundled into the APK (webDir: dist), so the app runs from
# https://localhost inside the WebView and talks to the Render HQ over the API —
# no Netlify or extra hosting needed. The APK is signed with the standard Android
# debug key, so it installs by sideloading (Settings → allow unknown sources).
#
# Run it: GitHub → Actions → "Build Android APK" → Run workflow. When it finishes,
# download the "virtual-office-debug-apk" artifact from the run summary.

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Team Hearth"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web assets (Vite)
        run: npm run build

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d android ]; then npx --no-install cap add android; fi

      - name: Sync Capacitor
        run: npx --no-install cap sync android

      - name: Build debug APK
        working-directory: "Team Hearth/android"
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtual-office-debug-apk
          path: "Team Hearth/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-file-found: error
